<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIBOTOL - Naves</title>
<style>
  body{margin:0;background:#070d16;color:#e8f1f8;font-family:"Segoe UI",sans-serif;text-align:center;padding:28px}
  h1{color:#00e5c7;margin:0 0 6px}
  p{color:#8fa3b5;margin:0 0 26px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;max-width:1100px;margin:0 auto}
  .card{background:#111c2b;border:1px solid #00e5c733;border-radius:14px;padding:14px}
  .card img{width:100%;height:180px;object-fit:contain;image-rendering:auto}
  .card b{display:block;color:#f0b429;font-size:15px;margin-top:8px}
</style>
</head>
<body>
<h1>BIBOTOL · Naves</h1>
<p>Cada nave con su nombre y fondo transparente</p>
<div class="grid" id="grid"></div>
<script>
  const naves = ["viper","specter","tulpar","obliterator","reaper","behemoth","nova","prometheus","tulparprime"];
  document.getElementById("grid").innerHTML = naves.map(n =>
    `<div class="card"><img src="ships/${n}.png" alt="${n}"><b>${n}</b></div>`).join("");
</script>
</body>
</html>
